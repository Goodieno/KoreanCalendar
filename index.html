<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tapdong TV Calendar</title>

<style>

/* ================= BASIC ================= */

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0f172a;
    color: white;
    zoom: 1.2; /* ✅ ONLY CHANGE */
}

.container {
    display: grid;
    grid-template-columns: 3fr 1fr;
    height: 100vh;
}
 
/* ================= CALENDAR ================= */

.calendar {
    padding: 30px;
}

.header {
    text-align: center;
    font-size: 48px;
    margin-bottom: 20px;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 34px;
    font-weight: bold;
}

.weekdays div {
    padding: 10px;
}

.sun { color: red; }
.sat { color: #60a5fa; }

.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 110px;
    gap: 6px;
    margin-top: 10px;
}

.day {
    background: #1e293b;
    border-radius: 12px;
    padding: 10px;
    position: relative;
    font-size: 34px;
}

.day.red {
    color: red;
}

.holiday {
    font-size: 16px;
    margin-top: 4px;
    color: #f87171;
}

/* ================= TODAY PULSE ================= */

.today {
    border: 4px solid red;
    box-shadow: 0 0 20px red;
    animation: pulse 1.5s infinite;
}

.today::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border: 4px solid red;
    border-radius: 50%;
    top: 6px;
    right: 6px;
}

@keyframes pulse {
    0% { box-shadow: 0 0 5px red; }
    50% { box-shadow: 0 0 40px red; }
    100% { box-shadow: 0 0 5px red; }
}

/* ================= SIDEBAR ================= */

.sidebar {
    background: #020617;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.clock {
    text-align: center;
    font-size: 56px;
    margin-bottom: 25px;
}

.info-box {
    background: #1e293b;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.info-box h3 {
    margin: 0 0 8px;
    font-size: 22px;
    text-align: center;
}

.info-box p {
    margin: 5px 0;
    font-size: 20px;
    text-align: center;
}

/* Larger Horizontal Dual Timer Styles */
#dualTimerContainer {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}
.timer-wrapper {
    text-align: center;
    width: 50%;
}
.period-status {
    font-size: 18px;
    font-weight: bold;
    margin-top: -10px;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Video Section */
.video-box {
    margin-top: auto;
}

.video-box iframe {
    width: 100%;
    height: 200px;
    border-radius: 12px;
    border: none;
}

</style>
</head>

<body>

<div class="container">

<div class="calendar">
    <div class="header" id="monthYear"></div>
    <div class="weekdays">
        <div class="sun">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="sat">토</div>
    </div>
    <div class="days" id="days"></div>
</div>

<div class="sidebar">

    <div>
        <div class="clock" id="clock"></div>
        <div class="info-box">
            <h3>🌤 Weather</h3>
            <p id="weather">Loading...</p>
        </div>
        <div class="info-box">
            <h3>😷 Air Quality</h3>
            <p id="air">Loading...</p>
        </div>
    </div>

    <div id="dualTimerContainer">
        <div class="timer-wrapper">
            <canvas id="timerLeft" width="220" height="220" style="width: 100%; height: auto;"></canvas>
            <div id="labelLeft" class="period-status"></div>
        </div>
        <div class="timer-wrapper">
            <canvas id="timerRight" width="220" height="220" style="width: 100%; height: auto;"></canvas>
            <div id="labelRight" class="period-status"></div>
        </div>
    </div>

    <div class="info-box video-box">
        <h3>📺 안내 영상</h3>
        <iframe
            src="https://www.youtube.com/embed/iLZbRyLwdgo?autoplay=1&loop=1&playlist=iLZbRyLwdgo&start=200"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

    <div style="text-align:center;font-size:14px;opacity:0.6; padding-top: 10px;">
        Dangjin • Korea
    </div>

</div>

</div>
